name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Mesmas credenciais que backend/.env.test já espera — tests/globalSetup.js
    # cria e migra o banco de teste (portaria_test) sozinho, não precisa de
    # mais nada além deste serviço estar de pé.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portaria_admin
          POSTGRES_PASSWORD: portaria_dev_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portaria_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
